<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC KIDS App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif, Tahoma; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; color: #333; }
    .container { max-width: 500px; background: white; margin: 0 auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
    
    /* สลับบทบาท & สลับภาษา */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .role-tabs { display: flex; gap: 5px; background: #eee; padding: 3px; border-radius: 10px; }
    .role-btn { border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; background: transparent; font-size: 12px; }
    .role-btn.active { background: #4A90E2; color: white; }
    
    .lang-switcher { display: flex; gap: 4px; }
    .lang-btn { padding: 4px 8px; font-size: 12px; background: #e0e0e0; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #333; color: white; font-weight: bold; }

    h1 { font-size: 24px; margin: 10px 0 5px; color: #2c3e50; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 20px; }

    /* ฟอร์ม & อินพุต */
    .form-group { text-align: left; margin-bottom: 12px; }
    label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    
    /* กล้องถ่ายรูป */
    .camera-box { background: #f8f9fa; border: 2px dashed #ccc; border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 15px; }
    video, canvas, img.preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; background: #000; margin-top: 8px; }
    .btn-cam { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 5px; }

    /* ปุ่มการทำงานหลัก */
    .btn-primary { width: 100%; background: #28a745; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-primary:hover { background: #218838; }

    /* การ์ดรายชื่อเด็ก */
    .card { background: #fff; border: 1px solid #e1e8ed; border-radius: 12px; padding: 12px; margin-bottom: 10px; text-align: left; display: flex; align-items: center; gap: 12px; position: relative; }
    .card img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; background: #ccc; }
    .card-info { flex: 1; }
    .card-info h4 { margin: 0 0 4px 0; font-size: 16px; color: #111; }
    .card-info p { margin: 2px 0; font-size: 12px; color: #666; }
    
    /* สถานะ */
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-in { background: #d4edda; color: #155724; }
    .badge-out { background: #f8d7da; color: #721c24; }

    .action-btns { display: flex; flex-direction: column; gap: 4px; }
    .btn-sm { padding: 6px 10px; font-size: 11px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-in { background: #17a2b8; color: white; }
    .btn-out { background: #ffc107; color: #333; }
    .btn-del { background: #dc3545; color: white; }

    /* ส่วนสลับหน้า */
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <!-- แถบควบคุมด้านบนสุด -->
    <div class="top-bar">
      <div class="role-tabs">
        <button class="role-btn active" id="btnRoleParent">👨‍👩‍👧 ผู้ปกครอง</button>
        <button class="role-btn" id="btnRoleAdmin">👨‍🏫 แอดมิน/ครู</button>
      </div>
      <div class="lang-switcher">
        <button class="lang-btn active" id="btnTH">TH</button>
        <button class="lang-btn" id="btnEN">EN</button>
      </div>
    </div>

    <h1>👦 LC KIDS 👧</h1>
    <p class="sub" id="txtSubHeader">ระบบเช็คชื่อและจัดการข้อมูลเด็ก</p>

    <!-- ================= หน้าผู้ปกครอง (Parent View) ================= -->
    <div id="pageParent" class="page active">
      <div class="form-group">
        <label id="lblChildName">ชื่อ - นามสกุล เด็ก</label>
        <input type="text" id="studentName" placeholder="เช่น น้องมีนา เรียนดี">
      </div>
      <div class="form-group">
        <label id="lblParentPhone">เบอร์โทรผู้ปกครอง</label>
        <input type="tel" id="parentPhone" placeholder="0812345678">
      </div>
      <div class="form-group">
        <label id="lblClassRoom">ห้องเรียน / กลุ่มอายุ</label>
        <select id="classRoom">
          <option value="Nursery">Nursery (1-3 ขวบ)</option>
          <option value="Kindergarten">อนุบาล (4-6 ขวบ)</option>
          <option value="Primary">ประถม (7-12 ขวบ)</option>
        </select>
      </div>

      <!-- กล้องถ่ายรูปเด็ก -->
      <div class="camera-box">
        <label id="lblCamera">📷 ถ่ายรูปเด็ก / สแกนใบหน้า</label>
        <video id="video" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="photoPreview" class="preview" src="https://via.placeholder.com/150?text=No+Photo" alt="Preview">
        <br>
        <button class="btn-cam" id="btnStartCam">เปิดกล้อง</button>
        <button class="btn-cam" id="btnCapture" style="display:none; background:#28a745;">ถ่ายรูป</button>
      </div>

      <button id="btnSave" class="btn-primary">ลงทะเบียนเด็กใหม่</button>
    </div>

    <!-- ================= หน้าแอดมิน / ครู (Admin View) ================= -->
    <div id="pageAdmin" class="page">
      <div class="form-group">
        <input type="text" id="searchBox" placeholder="🔍 ค้นหาชื่อเด็กหรือเบอร์โทร...">
      </div>

      <div style="display:flex; justify-size: space-between; margin-bottom: 10px; font-size: 13px;">
        <span>เด็กในระบบทั้งหมด: <strong id="totalCount">0</strong></span>
        <span>อยู่ในห้องเรียน: <strong id="inClassCount" style="color:#28a745;">0</strong></span>
      </div>

      <div id="studentList">
        <p style="text-align:center; color:#888;">กำลังโหลดข้อมูล...</p>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
